[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "nkscan"
description = "A platform-agnostic, performant interface to Nikon film scanners"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Kira Shila" }]
dynamic = ["version"]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/activexray/nkscan"

# Without this the extension builds with no #[pymodule] in it and imports as an empty module
[tool.maturin]
features = ["python"]
module-name = "nkscan"
# nkscan.pyi needs no `include`: maturin picks up <module>.pyi from the project root and adds the
# py.typed marker that PEP 561 requires for the stub to be honoured. It is generated by
# `cargo run --features python --bin stub_gen`, so it cannot drift from the bindings.
