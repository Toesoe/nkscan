[package]
name = "nkscan"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
bitflags = "2"
nusb = "0.2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "tiff",
] }
moxcms = "0.9"

# Python library dependencies
pyo3 = { version = "0.29", optional = true, features = ["abi3-py313"] }

# The CLI stack, which a library consumer has no use for
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
indicatif = { version = "0.18", optional = true }

[features]
cli = ["dep:tracing-subscriber", "dep:clap", "dep:anyhow", "dep:indicatif"]
python = ["dep:pyo3"]

[[bin]]
name = "nkscan"
path = "src/bin/nkscan/main.rs"
required-features = ["cli"]

[lib]
name = "nkscan"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] # For python support

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["ioctl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.18"
